services:
    app:
        command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
        build: 
            context: .
            dockerfile: docker-files/app/DockerFile
        volumes:
            - ./src:/app
            - ./.env:/app/.env
        depends_on:
            - redis

    redis:
        image: redis:7.4-alpine
        hostname: redis
        ports:
            - "6379:6379"
        restart: always


    nginx:
        build: 
            context: .
            dockerfile: docker-files/nginx/DockerFile
        volumes:     
            - ./docker-files/nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
        ports:
            - "4433:443"

        depends_on:
            - app
            - maildev


    maildev:
        image: maildev/maildev
        ports:
            - "1080:1080"

    celery:
        build: 
            context: .
            dockerfile: docker-files/app/DockerFile
        command: celery -A core worker --loglevel=info
        volumes:
            - ./src:/app
            - ./.env:/app/.env
        depends_on:
            - redis

    flower:
        build: 
            context: .
            dockerfile: docker-files/app/DockerFile
        command: celery -A core flower --port=5555
        volumes:
            - ./src:/app
            - ./.env:/app/.env
        ports:
            - "5555:5555"
        depends_on:
            - redis
