{% extends "base.html" %}



{% block content %}
<main class="h-100">
  <div class="d-flex h-100 ">
    <div class="d-flex flex-column p-2 gap-2 border-end h-100">
      <div class="d-flex flex-row gap-2">
           <div class="input-group">
             <i class="bi bi-search input-group-text" id="icon-search"></i>
             <input placeholder="Поиск пароля" class="form-control" type="search" aria-describedby="icon-search">
           </div>
           <div >
             <a
                hx-get="{% url 'website_data_create' %}" 
                hx-target="#detail_data"
                hx-trigger="click"
                hx-swap="innerHTML"
                href="#"
               class="btn btn-secondary p-0 bg-white border-white" type="submit">
               <i class="bi bi-plus-square fs-4 text-dark"></i>
             </a>
           </div>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <div class="">
          <p class="m-0"> Сортировать по:</p>
        </div>
        <div>        
           <select class="form-select form-select-sm w-auto" >
            <option value="1">Названию(А-Я)</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>
        </div>
      </div>
      <div class="h-100 border-top">
        <div class="list-group list-group-flush border-bottom scrollarea">
          {% for website in websites %}
            {% include "item_data_website.html" %}
          {% endfor %}
        </div>
        
      </div>
    </div>   
    <div class="p-3 flex-fill ">
      <div class="d-flex flex-column">
         <div class="d-flex justify-content-start">
           <div>
             
           </div>
           <div class="fs-1 fw-bold">
             Менеджер паролей 
           </div>
         </div>
         <div id="detail_data">
           
         </div>
      </div> 
    </div>

  </div>
</main>  

{% endblock %}
