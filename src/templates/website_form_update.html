{% extends "base.html" %}


{% block content %}


<div>
  <div class="py-4">
    <form id="create">
    <div class="d-flex gap-2 align-items-center justify-content-between">
      <div class=" fs-4 gap-2 align-items-center">
        <i class="bi bi-globe "></i>
        <span class="">{{ form.website_name }}</span>     
      </div>
    </div>
    <div>
        {% csrf_token %}
        <div class="d-flex py-4">
          <div class="d-flex flex-column gap-4">
            <div>
              <div>

              
                <div>
                  Адрес веб-сайта
                </div>
                <div>
               
                    {{ form.website_url}}
            
                </div>
              </div>
            </div>
            <div>
              <div> 
                <div>
                  Логин / Электронныая почта
                </div>
                <div>
                  {{ form.username }}
                </div>
              </div>
            </div>
            <div>
              <div>
                <div>
                  Пароль
                </div>
                <div>
                  {{ form.password}}
                </div>
              </div>
            </div>
            <div>
                {% for i in form.errors %}
                    {{ i }}
                {% endfor %}
            </div>
            <div>
              <button 
              hx-patch="{% url 'website_data_update' website.id %}"
              hx-target="#detail_data"
              hx-swap="innerHTML"
              type="button" class="btn btn-primary" 
              >Сохранить</button>
              
              <button 
              hx-get="{% url 'website_data_detail' website.id %}"
              hx-target="#detail_data"
              hx-swap="innerHTML"
              type="button" class="btn btn-danger"
              >Отменить</button>
            </div>

          </div>
          <div>
          </div>
        </div>
      </form>
    </div>
  </div> 
</div>


{% endblock %}
